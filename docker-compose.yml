version: '3.8'

services:
  smart-dust-control:
    build: .
    container_name: smart_dust_control_app
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:////app/stonemill.db
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./reports:/app/reports
      - ./logs:/app/logs
    restart: unless-stopped
